[package]
name = "hold-auto"
version = "2.0.0"
edition = "2024"

[dependencies]
eframe = "0.33"
enigo = "0.6"
rand = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_Media",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
